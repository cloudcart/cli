name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Replace workspace:* with actual versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          find packages -name 'package.json' -not -path '*/node_modules/*' \
            -exec sed -i "s|\"workspace:\*\"|\"^${VERSION}\"|g" {} +

      - name: Publish @cloudcart/cli-kit
        working-directory: packages/cli-kit
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @cloudcart/cli-kit version 2>/dev/null || true)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Skipping: @cloudcart/cli-kit@$LOCAL already on npm"
          else
            npm publish --access public --provenance
          fi

      - name: Publish @cloudcart/app
        working-directory: packages/app
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @cloudcart/app version 2>/dev/null || true)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Skipping: @cloudcart/app@$LOCAL already on npm"
          else
            npm publish --access public --provenance
          fi

      - name: Publish @cloudcart/theme
        working-directory: packages/theme
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @cloudcart/theme version 2>/dev/null || true)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Skipping: @cloudcart/theme@$LOCAL already on npm"
          else
            npm publish --access public --provenance
          fi

      - name: Publish @cloudcart/nitrogen-plugin
        working-directory: packages/nitrogen
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @cloudcart/nitrogen-plugin version 2>/dev/null || true)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Skipping: @cloudcart/nitrogen-plugin@$LOCAL already on npm"
          else
            npm publish --access public --provenance
          fi

      - name: Publish @cloudcart/cli
        working-directory: packages/cli
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @cloudcart/cli version 2>/dev/null || true)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "Skipping: @cloudcart/cli@$LOCAL already on npm"
          else
            npm publish --access public --ignore-scripts --provenance
          fi

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Skipping Homebrew update: cli package.json is $VERSION but release tag is $TAG_VERSION (no new cli published)"
            exit 0
          fi
          SHA256=$(curl -sL "https://registry.npmjs.org/@cloudcart/cli/-/cli-${VERSION}.tgz" | shasum -a 256 | cut -d' ' -f1)

          # Clone tap repo
          git clone https://x-access-token:${GH_TOKEN}@github.com/cloudcart/homebrew-tap.git /tmp/tap
          cd /tmp/tap

          # Update formula
          cat > Formula/cloudcart.rb << FORMULA
          class Cloudcart < Formula
            desc "AI-first developer CLI for managing CloudCart e-commerce stores"
            homepage "https://github.com/cloudcart/cli"
            url "https://registry.npmjs.org/@cloudcart/cli/-/cli-${VERSION}.tgz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node@22"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink libexec/"bin/cloudcart"
            end

            test do
              assert_match "cloudcart", shell_output("#{bin}/cloudcart --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/cloudcart.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cloudcart.rb
          git commit -m "Update cloudcart to ${VERSION}"
          git push
